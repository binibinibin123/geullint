name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p geullint-wasm --target wasm32-unknown-unknown --release

  npm-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test packages/npm/geullint/test/geullint.test.js
      - run: node --test scripts/*.test.mjs
      - name: Check the npm package contents
        working-directory: packages/npm/geullint
        run: npm pack --dry-run --json

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode-geullint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode-geullint/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
