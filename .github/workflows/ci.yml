name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-08-02)
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --no-fail-fast
      - run: cargo build -p geullint-wasm --target wasm32-unknown-unknown --release
      - run: cargo build -p geullint-cli
      - name: Validate the committed Korean safety corpus
        run: >-
          node scripts/validate-safety-corpus.mjs
          --corpus corpus/safety-regressions-v1.jsonl
          --policy corpus/safety-regressions-v1.policy.json
          --cli target/debug/geullint
      - name: Evaluate exact diagnostics and corrected text
        run: target/debug/geullint --corpus-manifest corpus/safety-regressions-v1.manifest.json
      - name: Check the reproducible ranker baseline and Korean red team
        run: |
          PYTHONPATH=training python -m unittest discover -s training/tests -v
          node scripts/red-team-korean.mjs --cli target/debug/geullint
      - name: Verify the checked-in commercial gate stays NO-GO without independent holdouts
        shell: bash
        run: |
          set +e
          node scripts/evaluate-commercial-gate.mjs \
            --cli target/debug/geullint \
            --corpus corpus/safety-regressions-v1.jsonl \
            --gate corpus/gates/commercial-near-v1.json \
            > commercial-gate-report.json
          status=$?
          set -e
          test "$status" -eq 1
          jq -e '.passed == false and .qualityGate.passed == false' commercial-gate-report.json

  npm-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: node --test packages/npm/geullint/test/geullint.test.js
      - run: node --test scripts/*.test.mjs
      - name: Check the npm package contents
        working-directory: packages/npm/geullint
        run: npm pack --dry-run --json

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode-geullint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode-geullint/package-lock.json
      - run: npm ci
      - run: npm audit --omit=optional --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run build
