name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (for example 0.2.0-alpha.1)
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_ref: ${{ steps.release_ref.outputs.release_ref }}
      release_sha: ${{ steps.version.outputs.release_sha }}
    steps:
      - name: Resolve the requested release tag
        id: release_ref
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_version="$INPUT_VERSION"
          else
            release_version="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid release version: $release_version" >&2
            exit 1
          fi

          release_ref=refs/tags/v${release_version}
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ steps.release_ref.outputs.release_ref }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-08-02)
        with:
          toolchain: 1.96.0
      - id: version
        env:
          RELEASE_REF: ${{ steps.release_ref.outputs.release_ref }}
          RELEASE_VERSION: ${{ steps.release_ref.outputs.version }}
        shell: bash
        run: |
          release_ref="$RELEASE_REF"
          release_version="$RELEASE_VERSION"
          release_sha="$(git rev-parse "${release_ref}^{commit}")"
          if [[ "$release_sha" != "$(git rev-parse HEAD)" ]]; then
            echo "Checkout does not match $release_ref." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$release_sha" != "$GITHUB_SHA" ]]; then
            echo "Release tag moved after this workflow was triggered." >&2
            exit 1
          fi

          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "geullint-cli") | .version')"
          if [[ "$release_version" != "$cargo_version" ]]; then
            echo "Tag version $release_version does not match Cargo version $cargo_version." >&2
            exit 1
          fi

          for package in packages/npm/*/package.json; do
            package_version="$(node -p "require('./' + process.argv[1]).version" "$package")"
            if [[ "$package_version" != "$release_version" ]]; then
              echo "$package has version $package_version, expected $release_version." >&2
              exit 1
            fi
          done

          extension_version="$(node -p "require('./extensions/vscode-geullint/package.json').version")"
          if [[ "$extension_version" != "$release_version" ]]; then
            echo "VS Code extension has version $extension_version, expected $release_version." >&2
            exit 1
          fi

          test -f "docs/quality-report-v${release_version}.md"

          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  verify-release:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-version.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-08-02)
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test -p geullint-core --no-default-features
      - run: node --test packages/npm/geullint/test/geullint.test.js
      - name: Check the npm launcher package contents
        working-directory: packages/npm/geullint
        run: npm pack --dry-run --json
      - run: node --test scripts/*.test.mjs
      - name: Check the VS Code extension
        working-directory: extensions/vscode-geullint
        run: |
          npm ci
          npm audit --omit=optional --audit-level=high
          npm run check
          npm test
          npm run build
      - name: Install the locked wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Exercise the browser WASM and enforce its size budget
        run: |
          node scripts/build-playground.mjs
          node scripts/wasm-runtime-parity.mjs
          node scripts/check-wasm-size.mjs
      - name: Install locked browser E2E dependencies
        working-directory: apps/playground
        run: npm ci --ignore-scripts
      - name: Audit browser E2E dependencies
        working-directory: apps/playground
        run: npm audit --audit-level=high
      - name: Install Chromium for the offline E2E contract
        working-directory: apps/playground
        run: npx playwright install --with-deps chromium
      - name: Exercise the offline correction workspace
        working-directory: apps/playground
        run: GEULLINT_E2E_REQUIRED=1 GEULLINT_E2E_VIEWPORTS=all npm run e2e
      - run: cargo build -p geullint-cli
      - name: Validate the committed Korean safety corpus
        run: >-
          node scripts/validate-safety-corpus.mjs
          --corpus corpus/safety-regressions-v1.jsonl
          --policy corpus/safety-regressions-v1.policy.json
          --cli target/debug/geullint
      - name: Evaluate exact diagnostics and corrected text
        run: target/debug/geullint --corpus-manifest corpus/safety-regressions-v1.manifest.json
      - name: Verify the local training contract and Korean red team
        run: |
          PYTHONPATH=training python -m unittest discover -s training/tests -v
          node scripts/red-team-korean.mjs --cli target/debug/geullint
      - name: Check the minimum supported Rust version
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --workspace --all-targets --all-features --locked

  build-platform-artifacts:
    needs: [validate-version, verify-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            package_name: geullint-win32-x64
            target_name: win32-x64
            binary_name: geullint.exe
            archive_extension: zip
          - runner: windows-11-arm
            package_name: geullint-win32-arm64
            target_name: win32-arm64
            binary_name: geullint.exe
            archive_extension: zip
          - runner: macos-15-intel
            package_name: geullint-darwin-x64
            target_name: darwin-x64
            binary_name: geullint
            archive_extension: tar.gz
          - runner: macos-15
            package_name: geullint-darwin-arm64
            target_name: darwin-arm64
            binary_name: geullint
            archive_extension: tar.gz
          - runner: ubuntu-latest
            package_name: geullint-linux-x64
            target_name: linux-x64
            binary_name: geullint
            archive_extension: tar.gz
          - runner: ubuntu-24.04-arm
            package_name: geullint-linux-arm64
            target_name: linux-arm64
            binary_name: geullint
            archive_extension: tar.gz
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-version.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-08-02)
        with:
          toolchain: 1.96.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Build and stage the native npm package
        shell: pwsh
        run: |
          cargo build --release --locked -p geullint-cli

          $packageDirectory = "packages/npm/${{ matrix.package_name }}"
          $binaryDirectory = Join-Path $packageDirectory "bin"
          New-Item -ItemType Directory -Force -Path $binaryDirectory | Out-Null
          Copy-Item "target/release/${{ matrix.binary_name }}" (Join-Path $binaryDirectory "${{ matrix.binary_name }}")
          Copy-Item LICENSE (Join-Path $packageDirectory "LICENSE")
          Copy-Item THIRD_PARTY_NOTICES.md (Join-Path $packageDirectory "NOTICE")
          $packageLicenseDirectory = Join-Path $packageDirectory "LICENSES"
          New-Item -ItemType Directory -Force -Path $packageLicenseDirectory | Out-Null
          Copy-Item "LICENSES/Apache-2.0.txt" (Join-Path $packageLicenseDirectory "Apache-2.0.txt")

      - name: Create a compressed fallback archive and checksum
        id: archive
        shell: pwsh
        run: |
          $archiveStem = "geullint-v$env:RELEASE_VERSION-${{ matrix.target_name }}"
          $stagingDirectory = Join-Path "release-staging" $archiveStem
          New-Item -ItemType Directory -Force -Path $stagingDirectory | Out-Null
          Copy-Item "target/release/${{ matrix.binary_name }}" (Join-Path $stagingDirectory "${{ matrix.binary_name }}")
          Copy-Item LICENSE (Join-Path $stagingDirectory "LICENSE")
          Copy-Item THIRD_PARTY_NOTICES.md (Join-Path $stagingDirectory "NOTICE")
          Copy-Item -Recurse -Force LICENSES (Join-Path $stagingDirectory "LICENSES")

          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          if ("${{ matrix.archive_extension }}" -eq "zip") {
            $archive = "release-artifacts/$archiveStem.zip"
            Compress-Archive -Path $stagingDirectory -DestinationPath $archive
          } else {
            $archive = "release-artifacts/$archiveStem.tar.gz"
            tar -C release-staging -czf $archive $archiveStem
          }

          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -NoNewline "$archive.sha256"
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Smoke-test the checksummed release archive
        run: node scripts/release-smoke.mjs "${{ steps.archive.outputs.archive }}" "${{ steps.archive.outputs.archive }}.sha256" "${{ matrix.binary_name }}"

      - name: Generate an SBOM for the downloadable archive
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          # Scan the unpacked payload so the SPDX document describes the binary,
          # notices, and license files rather than only the outer archive.
          path: release-staging/geullint-v${{ env.RELEASE_VERSION }}-${{ matrix.target_name }}
          format: spdx-json
          output-file: release-artifacts/geullint-v${{ env.RELEASE_VERSION }}-${{ matrix.target_name }}.spdx.json
          upload-artifact: false
      - name: Attest the downloadable archive and its SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ steps.archive.outputs.archive }}
          sbom-path: release-artifacts/geullint-v${{ env.RELEASE_VERSION }}-${{ matrix.target_name }}.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target_name }}
          path: release-artifacts/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-${{ matrix.target_name }}
          path: packages/npm/${{ matrix.package_name }}
          if-no-files-found: error

  publish-platform-packages:
    needs: [validate-version, verify-release, build-platform-artifacts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_name: geullint-win32-x64
            target_name: win32-x64
          - package_name: geullint-win32-arm64
            target_name: win32-arm64
          - package_name: geullint-darwin-x64
            target_name: darwin-x64
          - package_name: geullint-darwin-arm64
            target_name: darwin-arm64
          - package_name: geullint-linux-x64
            target_name: linux-x64
          - package_name: geullint-linux-arm64
            target_name: linux-arm64
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-version.outputs.release_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-${{ matrix.target_name }}
          path: packages/npm/${{ matrix.package_name }}
      - name: Restore executable mode on the downloaded Unix binary
        if: startsWith(matrix.target_name, 'darwin-') || startsWith(matrix.target_name, 'linux-')
        shell: bash
        run: chmod 0755 "packages/npm/${{ matrix.package_name }}/bin/geullint"
      - name: Publish the native npm package when credentials are configured
        if: env.HAS_NPM_TOKEN == 'true'
        working-directory: packages/npm/${{ matrix.package_name }}
        shell: bash
        run: |
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi

  publish-launcher:
    needs: [validate-version, verify-release, publish-platform-packages]
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-version.outputs.release_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish the geullint launcher package
        if: env.HAS_NPM_TOKEN == 'true'
        working-directory: packages/npm/geullint
        shell: bash
        run: |
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi

  package-vscode-extension:
    needs: [validate-version, verify-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target_name: win32-x64
            binary_name: geullint-lsp.exe
          - runner: windows-11-arm
            target_name: win32-arm64
            binary_name: geullint-lsp.exe
          - runner: macos-15-intel
            target_name: darwin-x64
            binary_name: geullint-lsp
          - runner: macos-15
            target_name: darwin-arm64
            binary_name: geullint-lsp
          - runner: ubuntu-latest
            target_name: linux-x64
            binary_name: geullint-lsp
          - runner: ubuntu-24.04-arm
            target_name: linux-arm64
            binary_name: geullint-lsp
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-version.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-08-02)
        with:
          toolchain: 1.96.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode-geullint/package-lock.json
      - name: Build and bundle the offline language server
        shell: pwsh
        run: |
          cargo build --release --locked -p geullint-lsp
          $serverDirectory = "extensions/vscode-geullint/server/${{ matrix.target_name }}"
          New-Item -ItemType Directory -Force -Path $serverDirectory | Out-Null
          Copy-Item "target/release/${{ matrix.binary_name }}" (Join-Path $serverDirectory "${{ matrix.binary_name }}")
          Copy-Item THIRD_PARTY_NOTICES.md "extensions/vscode-geullint/THIRD_PARTY_NOTICES.md"
          Copy-Item -Recurse -Force LICENSES "extensions/vscode-geullint/LICENSES"
      - name: Package the platform-matched VSIX
        working-directory: extensions/vscode-geullint
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../../release-artifacts | Out-Null
          npm ci
          npm run build
          $vsix = "../../release-artifacts/geullint-v$env:RELEASE_VERSION-vscode-${{ matrix.target_name }}.vsix"
          npx vsce package --no-dependencies --out $vsix
          node ../../scripts/vsix-smoke.mjs $vsix "${{ matrix.target_name }}" "${{ matrix.binary_name }}"
          $hash = (Get-FileHash -Algorithm SHA256 $vsix).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $vsix)" | Set-Content -NoNewline "$vsix.sha256"
          $vsixContents = "../../release-staging/vsix-${{ matrix.target_name }}"
          Expand-Archive -Path $vsix -DestinationPath $vsixContents -Force
      - name: Generate a VSIX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          # Scan the VSIX payload instead of treating the zip as one opaque file.
          path: release-staging/vsix-${{ matrix.target_name }}
          format: spdx-json
          output-file: release-artifacts/geullint-v${{ env.RELEASE_VERSION }}-vscode-${{ matrix.target_name }}.spdx.json
          upload-artifact: false
      - name: Attest the VSIX and its SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: release-artifacts/geullint-v${{ env.RELEASE_VERSION }}-vscode-${{ matrix.target_name }}.vsix
          sbom-path: release-artifacts/geullint-v${{ env.RELEASE_VERSION }}-vscode-${{ matrix.target_name }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-vscode-${{ matrix.target_name }}
          path: release-artifacts/*
          if-no-files-found: error

  create-github-release:
    needs: [validate-version, verify-release, build-platform-artifacts, package-vscode-extension]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
      RELEASE_REF: ${{ needs.validate-version.outputs.release_ref }}
      RELEASE_SHA: ${{ needs.validate-version.outputs.release_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-version.outputs.release_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Add one-command installers
        shell: bash
        run: |
          cp install.sh install.ps1 release-assets/
          bash -n release-assets/install.sh
          (
            cd release-assets
            sha256sum install.sh > install.sh.sha256
            sha256sum install.ps1 > install.ps1.sha256
          )
      - name: Parse the PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "release-assets/install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Attest the downloadable installer scripts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            release-assets/install.sh
            release-assets/install.ps1
      - name: Extract release notes from the changelog
        shell: bash
        run: |
          awk -v version="$RELEASE_VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 42 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          cat >> release-notes.md <<EOF

          Quality report: https://github.com/binibinibin123/geullint/blob/v${RELEASE_VERSION}/docs/quality-report-v${RELEASE_VERSION}.md

          Browser demo: https://binibinibin123.github.io/geullint/
          EOF
      - name: Publish the checksummed cross-platform release
        shell: bash
        run: |
          release_tag="v${RELEASE_VERSION}"
          release_title="GeulLint v${RELEASE_VERSION}"
          tag_sha="$(git rev-parse "${RELEASE_REF}^{commit}")"
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "$RELEASE_REF moved after validation; refusing to release." >&2
            exit 1
          fi
          release_flags=()
          if [[ "${RELEASE_VERSION}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-assets/* --clobber
            gh release edit "$release_tag" --title "$release_title" --notes-file release-notes.md "${release_flags[@]}"
          else
            gh release create "$release_tag" release-assets/* \
              --title "$release_title" \
              --notes-file release-notes.md \
              "${release_flags[@]}"
          fi
