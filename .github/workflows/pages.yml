name: Deploy playground

on:
  push:
    branches: [master]
    paths:
      - apps/playground/**
      - crates/geullint-core/**
      - crates/geullint-wasm/**
      - rules/**
      - scripts/build-playground.mjs
      - scripts/playground-e2e.spec.mjs
      - apps/playground/package.json
      - apps/playground/package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-08-02)
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: node --test scripts/playground-contract.test.mjs
      - run: node scripts/build-playground.mjs
      - name: Install locked browser E2E dependencies
        working-directory: apps/playground
        run: npm ci --ignore-scripts
      - name: Audit browser E2E dependencies
        working-directory: apps/playground
        run: npm audit --audit-level=high
      - name: Install Chromium for the offline E2E contract
        working-directory: apps/playground
        run: npx playwright install --with-deps chromium
      - name: Exercise the offline correction workspace
        working-directory: apps/playground
        run: GEULLINT_E2E_REQUIRED=1 GEULLINT_E2E_VIEWPORTS=all npm run e2e
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/playground

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
