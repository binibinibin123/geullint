name: Feature request
description: 새로운 사용 흐름, 통합 또는 프로젝트 개선 제안
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "해결책보다 먼저 사용자가 겪는 문제를 설명해 주세요."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 누구에게 어떤 문제가 생기나요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: surface
    attributes:
      label: Main surface
      options: [CLI, VS Code, LSP, Browser playground, Documentation, Distribution]
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: 제안은 기본 오프라인 동작을 유지합니다.
          required: true
        - label: 공개 규칙과 결정적 결과 원칙을 유지합니다.
          required: true
