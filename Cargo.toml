[workspace]
members = [
    "crates/geullint-core",
    "crates/geullint-cli",
    "crates/geullint-lsp",
    "crates/geullint-wasm",
]
resolver = "2"

[workspace.package]
version = "0.4.0-beta.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/binibinibin123/geullint"

[workspace.dependencies]
aho-corasick = "1.1"
anyhow = "1.0.100"
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.18"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
