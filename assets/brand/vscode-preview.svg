<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">GeulLint VS Code extension preview</title>
  <desc id="desc">A Korean document with inline GeulLint diagnostics, quick fixes, and a searchable curated rule catalogue.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#07100b" flood-opacity=".28"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.15" fill="#18211c" opacity=".17"/>
    </pattern>
  </defs>
  <rect width="1440" height="900" fill="#f1efe6"/>
  <rect width="1440" height="900" fill="url(#dots)"/>
  <text x="78" y="78" fill="#ff5b35" font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="3">WRITE LOCALLY · CHECK INSTANTLY</text>
