[package]
name = "geullint-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
geullint-core = { path = "../geullint-core" }
geullint-lsp = { path = "../geullint-lsp" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1.49.0", features = ["rt-multi-thread"] }
walkdir = "2.5.0"

[[bin]]
name = "geullint"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.3"
tempfile = "3.24.0"

[lints]
workspace = true
