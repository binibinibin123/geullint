[package]
name = "geullint-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
standard = ["geullint-core/standard"]

[dependencies]
geullint-core = { path = "../geullint-core" }
serde_json.workspace = true
tokio = { version = "1.49.0", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp-server = "0.23.0"

[[bin]]
name = "geullint-lsp"
path = "src/main.rs"

[lints]
workspace = true
